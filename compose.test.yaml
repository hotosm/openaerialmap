# CI test runner: each uploader component's pytest suite in its built image.
name: oam-uploader-test

services:
  test-app:
    build:
      context: backend/uploader-api
      dockerfile: Dockerfile
      target: test
    command: ["pytest", "tests"]

  test-metadata:
    build:
      context: backend
      dockerfile: uploader-api/pipeline/metadata/Dockerfile
      target: test
    command: ["pytest", "metadata/tests"]
