# CI test runner: each component's pytest suite in its built image.
name: oam-uploader-test

services:
  test-app:
    build:
      context: backend/uploader-api
      dockerfile: Dockerfile
      target: test
    environment:
      # The DB-backed tests skip when nothing answers here.
      DB_HOST: test-db
      DB_USER: oam
      DB_PASSWORD: oam
      DB_NAME: oam_uploader
    depends_on:
      test-migrations:
        condition: service_completed_successfully
    command: ["pytest", "tests"]

  # Applies the shipping schema with the same runner production uses.
  test-migrations:
    build:
      context: backend/uploader-api
      dockerfile: Dockerfile
      # Not the test image; psql and the entrypoint only exist in prod.
      target: prod
    environment:
      DB_HOST: test-db
      DB_USER: oam
      DB_PASSWORD: oam
      DB_NAME: oam_uploader
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["/migrate-entrypoint.sh"]
    restart: "no"

  test-db:
    image: docker.io/postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: oam
      POSTGRES_PASSWORD: oam
      POSTGRES_DB: oam_uploader
    # No volume, CI should start empty every run.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oam -d oam_uploader"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-fetch:
    build:
      context: backend
      dockerfile: uploader-api/pipeline/fetch/Dockerfile
      target: test
    command: ["pytest", "fetch/tests"]

  test-validate:
    build:
      context: backend
      dockerfile: uploader-api/pipeline/validate/Dockerfile
      target: test
    command: ["pytest", "validate/tests"]

  test-convert:
    build:
      context: backend
      dockerfile: uploader-api/pipeline/convert/Dockerfile
      target: test
    command: ["pytest", "convert/tests"]

  test-metadata:
    build:
      context: backend
      dockerfile: uploader-api/pipeline/metadata/Dockerfile
      target: test
    command: ["pytest", "metadata/tests"]

  # Throwaway pgstac for the catalog stats tests, which wipe its items and collections.
  test-pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.10.1
    environment: &pgstac-env
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgis
      PGUSER: username
      PGPASSWORD: password
      PGDATABASE: postgis
    tmpfs:
      - /var/lib/postgresql/data
    # Over TCP, so it only passes once the init-time server (socket only) has migrated and restarted.
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -tAc 'SELECT pgstac.get_version()'"]
      interval: 2s
      timeout: 5s
      retries: 60

  test-global-mosaic:
    build:
      context: backend/global-mosaic
      dockerfile: Dockerfile
      target: test
    environment:
      <<: *pgstac-env
      # libpq reads the rest from the PG* variables above.
      PGSTAC_TEST_DSN: host=test-pgstac
    depends_on:
      test-pgstac:
        condition: service_healthy
