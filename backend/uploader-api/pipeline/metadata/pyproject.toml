[project]
name = "oam-pipeline-metadata"
version = "0.1.0"
requires-python = ">=3.12"
# Floors express what this step needs; pipeline/uv.lock holds the exact pins.
# stactools-hotosm's revision is pinned at the workspace root (shared source).
dependencies = ["stactools-hotosm", "numpy>=2", "rasterio>=1.5", "shapely>=2.1", "pyproj>=3.7"]

[dependency-groups]
test = ["pytest>=8"]
