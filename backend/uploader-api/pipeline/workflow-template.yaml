# Keep this namespaced to avoid cluster-wide Argo permissions.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: geotiff-processing-template
spec:
  serviceAccountName: argo-odm
  entrypoint: entry
  onExit: exit-handler
  # Every workflow holds a 300Gi volume until it completes, and volumeClaimGC
  # only runs when it does. Well above a legitimate run on the largest upload
  # we accept; anything past it is stuck, not slow.
  # TODO verify a 100GiB upload really does finish inside this, and in 300Gi.
  # Lever: COG_VERIFY=off on convert, six full-resolution passes over both files.
  # Lever: raise this, remembering the PVC is held until the workflow completes.
  # Lever: lower COG_LEVEL from 12, where most of the conversion time goes.
  activeDeadlineSeconds: 21600
  # Archive step logs before pod garbage collection.
  archiveLogs: true
  # Keep failed workflows for diagnosis and discard successful ones quickly.
  ttlStrategy:
    secondsAfterSuccess: 60
    secondsAfterFailure: 86400
    secondsAfterCompletion: 86400
  # Keep pods through the run, then release their shared 300Gi PVC.
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  # These pods parse imagery a stranger supplied, through GDAL, which is a large
  # amount of C reading a format with a long history of parser bugs. Keep the
  # Kubernetes API token out of the container that does it: the executor needs a
  # token, the step does not, and this is how Argo separates the two.
  automountServiceAccountToken: false
  executor:
    serviceAccountName: argo-odm
  podSpecPatch: |
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      # So the workspace volume is writable without running as root.
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  arguments:
    parameters:
      - name: s3-path
      - name: filename
      - name: bucket
      - name: key
      - name: id
      - name: uuid # authenticated user subject
      - name: state # per-upload callback token (X-Internal-Token)
      - name: externalaws # public S3/CDN endpoint used to build asset URLs
      - name: awsurl # S3 endpoint reachable in-cluster
      - name: fronturl # uploader-api base URL for status + register callbacks
      # "s3" = the bytes are already in our bucket (browser multipart upload);
      # "url" = fetch them from the caller's source URL first.
      - name: source-type
        value: "s3"
      # Upload size ceiling, enforced while the bytes arrive so a lying or
      # absent Content-Length cannot fill the workspace volume.
      - name: max-fetch-bytes
        value: "107374182400"
      # Mirrors the API's FETCH_ALLOW_PRIVATE_HOSTS. On for local development,
      # where the object store is in-network; an SSRF primitive anywhere else.
      - name: allow-private-hosts
        value: "false"
      # Production submissions use an immutable image tag.
      - name: image-tag
        value: "latest"
      # aws-cli needs a region even against non-AWS endpoints. Defaulted so the
      # uploader does not have to pass it.
      - name: awsregion
        value: "us-east-1"

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Argo does not allow parameters in PVC sizes.
            storage: 300Gi

  templates:
    - name: entry
      dag:
        tasks:
          - name: fetch
            template: fetch-source
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - { name: step-id, value: "Fetching" }
                    - { name: message, value: "Retrieving the imagery…" }

          - name: validate
            depends: "fetch.Succeeded"
            template: validate-geotiff
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - { name: step-id, value: "Validating" }
                    - { name: message, value: "Validating GeoTIFF…" }

          - name: convert
            depends: "validate.Succeeded"
            template: convert-cog
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - { name: step-id, value: "Converting" }
                    - { name: message, value: "Converting to Cloud-Optimized GeoTIFF…" }

          - name: metadata
            depends: "convert.Succeeded"
            template: build-metadata

          - name: upload-cog
            depends: "convert.Succeeded"
            template: s3-upload-cog
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - { name: step-id, value: "Uploading" }
                    - { name: message, value: "Uploading COG to storage…" }

          - name: upload-meta
            depends: "metadata.Succeeded"
            template: s3-upload-meta

          - name: register
            depends: "upload-cog.Succeeded && upload-meta.Succeeded"
            template: register-stac
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - { name: step-id, value: "Registering" }
                    - { name: message, value: "Registering item with STAC catalog…" }

          # Bytes that failed the fetch reached the bucket only if they got as
          # far as being archived, and bytes that failed validation are not
          # imagery. Either way they must not sit in a world-readable bucket
          # under a URL the uploader already knows.
          - name: cleanup-on-fetch-failure
            depends: "fetch.Failed"
            template: purge-objects

          - name: cleanup-on-failure
            depends: "validate.Failed"
            template: cleanup
            arguments:
              parameters:
                - { name: val-exit-code, value: "{{tasks.validate.exitCode}}" }

    # Only failure. The register step's own API call is what marks an upload
    # Succeeded, so reporting it again here would be a second message to lose,
    # against a callback token that terminal status has already expired.
    # The API resolves an empty failure message from the workflow's pod nodes.
    - name: exit-handler
      steps:
        - - name: report-failure
            template: report-status
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - { name: step-id, value: "Failed" }
                - { name: message, value: "" }

    # Gets the imagery onto the workspace volume, whichever way it arrived, and
    # leaves /data/input.tif + /data/meta.json for every later step. Everything
    # downstream reads local files, so this is the only step that knows or cares
    # where an upload came from - and the only one that talks to an address the
    # uploader chose. See pipeline/fetch/fetch.py for what it will and will not
    # fetch; the short version is https, no credentials, public addresses only,
    # rechecked on every redirect, and TIFF bytes or a narrowly handled ODM
    # all.zip archive containing that TIFF.
    - name: fetch-source
      container:
        image: ghcr.io/hotosm/openaerialmap/uploader/fetch:{{workflow.parameters.image-tag}}
        # Avoid Argo's GHCR entrypoint lookup, which bypasses private mirrors.
        command: ["python", "fetch.py"]
        securityContext: &stepSecurity
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_ACCESS_KEY }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_SECRET_KEY }
          - { name: AWS_DEFAULT_REGION, value: "{{workflow.parameters.awsregion}}" }
          - { name: S3_ENDPOINT, value: "{{workflow.parameters.awsurl}}" }
          - { name: S3_BUCKET, value: "{{workflow.parameters.bucket}}" }
          - { name: S3_KEY, value: "{{workflow.parameters.key}}" }
          - { name: FRONT_URL, value: "{{workflow.parameters.fronturl}}" }
          - { name: UPLOAD_ID, value: "{{workflow.parameters.id}}" }
          # The source URL is deliberately not a parameter: the step reads it
          # back over this token, so a presigned URL never lands in a Workflow
          # spec that anyone with Argo read access can see.
          - { name: INTERNAL_TOKEN, value: "{{workflow.parameters.state}}" }
          - { name: SOURCE_TYPE, value: "{{workflow.parameters.source-type}}" }
          - { name: MAX_FETCH_BYTES, value: "{{workflow.parameters.max-fetch-bytes}}" }
          - name: ALLOW_PRIVATE_HOSTS
            value: "{{workflow.parameters.allow-private-hosts}}"
        volumeMounts:
          - { name: workspace, mountPath: /data }
        resources:
          # Streams to disk, so this is buffers and a multipart upload. Written
          # in the same shape as the other steps so `just test` can downscale it.
          requests: {memory: "512Mi", cpu: "500m"}
          limits: {memory: "1Gi", cpu: "1"}
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
        # Only retry what a retry could fix. A 404, a rejected host or bytes
        # that are not a GeoTIFF fail identically every time, and the uploader
        # has already been told which of those it was.
        expression: "lastRetry.status == 'Error' or asInt(lastRetry.exitCode) == 75"

    - name: validate-geotiff
      container:
        image: ghcr.io/hotosm/openaerialmap/uploader/validate:{{workflow.parameters.image-tag}}
        # Avoid Argo's GHCR entrypoint lookup, which bypasses private mirrors.
        command: ["python", "validate.py"]
        args: ["/data/input.tif", "/data/meta.json"]
        securityContext: *stepSecurity
        env:
          # Stop GDAL listing the directory to find sidecar files. Nothing here
          # ships an .aux.xml or an .ovr, and an upload should not get to
          # introduce one.
          - { name: GDAL_DISABLE_READDIR_ON_OPEN, value: "EMPTY_DIR" }
        volumeMounts:
          - { name: workspace, mountPath: /data }
        resources:
          requests: { memory: "2Gi", cpu: "1" }
          limits: { memory: "4Gi", cpu: "2" }

    - name: convert-cog
      container:
        image: ghcr.io/hotosm/openaerialmap/uploader/convert:{{workflow.parameters.image-tag}}
        command: ["python", "convert.py"]
        args: ["/data/input.tif", "/data/output.tif"]
        securityContext: *stepSecurity
        env:
          - { name: GDAL_CACHEMAX, value: "512" }
          - { name: TMPDIR, value: "/data/tmp" }
          - { name: GDAL_DISABLE_READDIR_ON_OPEN, value: "EMPTY_DIR" }
          # Local Talos misreports capacity, so tests disable this production guard.
          - { name: CHECK_DISK_FREE_SPACE, value: "TRUE" }
        volumeMounts:
          - { name: workspace, mountPath: /data }
        resources:
          # Memory follows cache size; storage must also fit temporary files.
          requests: { memory: "2Gi", cpu: "2" }
          limits: { memory: "4Gi", cpu: "4" }
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: build-metadata
      container:
        image: ghcr.io/hotosm/openaerialmap/uploader/metadata:{{workflow.parameters.image-tag}}
        command: ["python", "metadata.py"]
        args:
          - "/data/output.tif"
          - "/data/meta.json"
          - "/data/"
          - "{{workflow.parameters.id}}"
          - "{{workflow.parameters.externalaws}}"
          - "{{workflow.parameters.bucket}}"
          - "{{workflow.parameters.key}}"
          - "/data/input.tif"
        securityContext: *stepSecurity
        env:
          - { name: GDAL_DISABLE_READDIR_ON_OPEN, value: "EMPTY_DIR" }
        volumeMounts:
          - { name: workspace, mountPath: /data }
        resources:
          requests: { memory: "2Gi", cpu: "1" }
          limits: { memory: "4Gi", cpu: "2" }
      retryStrategy:
        limit: "2"
        retryPolicy: "OnFailure"

    - name: s3-upload-cog
      container:
        image: amazon/aws-cli:2.36.15
        securityContext: *stepSecurity
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_ACCESS_KEY }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_SECRET_KEY }
          - name: AWS_DEFAULT_REGION
            value: "{{workflow.parameters.awsregion}}"
        command: [sh, -c]
        args:
          - |
            set -eu
            EP="{{workflow.parameters.awsurl}}"
            AWS="aws"; [ -n "$EP" ] && AWS="aws --endpoint-url=$EP"
            $AWS s3 cp /data/output.tif \
              {{workflow.parameters.s3-path}}cog-{{workflow.parameters.filename}}
        volumeMounts:
          - { name: workspace, mountPath: /data }
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: s3-upload-meta
      container:
        image: amazon/aws-cli:2.36.15
        securityContext: *stepSecurity
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_ACCESS_KEY }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_SECRET_KEY }
          - name: AWS_DEFAULT_REGION
            value: "{{workflow.parameters.awsregion}}"
        command: [sh, -c]
        args:
          - |
            set -eu
            EP="{{workflow.parameters.awsurl}}"
            AWS="aws"; [ -n "$EP" ] && AWS="aws --endpoint-url=$EP"
            $AWS s3 cp /data/metadata.json {{workflow.parameters.s3-path}}metadata.json
            $AWS s3 cp /data/thumbnail.png {{workflow.parameters.s3-path}}thumbnail.png
        volumeMounts:
          - { name: workspace, mountPath: /data }
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: register-stac
      container:
        image: ghcr.io/hotosm/openaerialmap/uploader/register:{{workflow.parameters.image-tag}}
        command: ["python", "register.py"]
        args: ["/data/metadata.json"]
        securityContext: *stepSecurity
        env:
          # Keep pgstac credentials in the token-guarded API, not this pod.
          - { name: FRONT_URL, value: "{{workflow.parameters.fronturl}}" }
          - { name: INTERNAL_TOKEN, value: "{{workflow.parameters.state}}" }
        volumeMounts:
          - { name: workspace, mountPath: /data }
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    # Validation failed, whatever the reason: say which one, and take the
    # rejected bytes back out of the bucket. Runs for every non-zero exit, not
    # just the mapped ones - an unmapped failure still leaves objects behind.
    - name: cleanup
      inputs:
        parameters:
          - name: val-exit-code
      container:
        image: amazon/aws-cli:2.36.15
        securityContext: *stepSecurity
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_ACCESS_KEY }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_SECRET_KEY }
          - name: AWS_DEFAULT_REGION
            value: "{{workflow.parameters.awsregion}}"
        command: [sh, -c]
        args:
          - |
            EP="{{workflow.parameters.awsurl}}"
            AWS="aws"; [ -n "$EP" ] && AWS="aws --endpoint-url=$EP"
            # The upload ID in this prefix prevents deletion of sibling uploads.
            $AWS s3 rm {{workflow.parameters.s3-path}} --recursive
            CODE="{{inputs.parameters.val-exit-code}}"
            MSG="Validation failed."
            [ "$CODE" = "5" ] && MSG="Invalid raster: not georeferenced (no CRS)."
            [ "$CODE" = "6" ] && MSG="Invalid raster: image is too large."
            [ "$CODE" = "7" ] && MSG="Invalid raster: content does not match the declared product type."
            [ "$CODE" = "8" ] && MSG="This file is not a GeoTIFF."
            cat <<EOF > /tmp/payload.json
            {"id": "{{workflow.parameters.id}}", "status": "Failed", "message": "$MSG"}
            EOF
            curl -sf -X POST {{workflow.parameters.fronturl}}/api/v1/workflowstatus \
              -H "Content-Type: application/json" \
              -H "X-Internal-Token: {{workflow.parameters.state}}" \
              -d @/tmp/payload.json
            exit 1

    # The same purge with no status report, for a step that has already sent its
    # own. The fetch step knows whether the URL 404'd or served a login page;
    # this would only overwrite that with something vaguer.
    - name: purge-objects
      container:
        image: amazon/aws-cli:2.36.15
        securityContext: *stepSecurity
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_ACCESS_KEY }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: oam-s3-creds, key: S3_SECRET_KEY }
          - name: AWS_DEFAULT_REGION
            value: "{{workflow.parameters.awsregion}}"
        command: [sh, -c]
        args:
          - |
            set -eu
            EP="{{workflow.parameters.awsurl}}"
            AWS="aws"; [ -n "$EP" ] && AWS="aws --endpoint-url=$EP"
            # The upload ID in this prefix prevents deletion of sibling uploads.
            $AWS s3 rm {{workflow.parameters.s3-path}} --recursive
            # Keep the workflow failed; the step that failed said why.
            exit 1

    - name: report-status
      inputs:
        parameters:
          - name: step-id
          - name: message
      container:
        image: curlimages/curl:8.21.0
        securityContext: *stepSecurity
        command: [sh, -c]
        args:
          - |
            curl -sf -X POST {{workflow.parameters.fronturl}}/api/v1/workflowstatus \
              -H "Content-Type: application/json" \
              -H "X-Internal-Token: {{workflow.parameters.state}}" \
              -d '{"id":"{{workflow.parameters.id}}","status":"{{inputs.parameters.step-id}}","message":"{{inputs.parameters.message}}"}'
      # A dropped status message leaves the upload showing the previous stage,
      # and for the exit handler it is the only report the uploader gets.
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
