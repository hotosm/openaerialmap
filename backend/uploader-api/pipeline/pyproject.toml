# A shared lock keeps rasterio and GDAL consistent across raster steps.
# Register is stdlib-only and stays outside the workspace.
[tool.uv.workspace]
members = ["validate", "convert", "metadata"]

# Match the bulk ingester revision so both paths emit the same OAM extension.
[tool.uv.sources]
stactools-hotosm = { git = "https://github.com/hotosm/stactools-hotosm", rev = "v0.2.1" }
