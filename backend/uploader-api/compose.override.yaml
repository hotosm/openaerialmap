# Standalone S3 services, loaded automatically from this directory.
services:
  uploader-api:
    depends_on:
      uploader-s3-init:
        condition: service_completed_successfully

  # S3-compatible object storage for standalone testing.
  uploader-s3:
    image: rustfs/rustfs:1.0.0-rc.3
    environment:
      RUSTFS_ACCESS_KEY: oam
      RUSTFS_SECRET_KEY: oam
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # presigned PUTs from the browser / test script
      - "9001:9001" # console
    volumes:
      - uploader_s3_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Create the bucket, public-read policy, and browser CORS rule. Same script
  # the chart's bucket-init job runs.
  uploader-s3-init:
    image: ghcr.io/hotosm/openaerialmap/uploader-api:debug
    build: .
    depends_on:
      uploader-s3:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ENDPOINT: http://uploader-s3:9000
      S3_BUCKET: oam
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: oam
      AWS_SECRET_ACCESS_KEY: oam
      INIT_CORS_ORIGINS: http://localhost:8090
    command: ["python", "/app/scripts/init_bucket.py"]

volumes:
  uploader_s3_data:
