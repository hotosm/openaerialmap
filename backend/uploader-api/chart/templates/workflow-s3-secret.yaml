{{- if .Values.workflowS3Secret.create }}
# The separately deployed WorkflowTemplate expects this secret name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.workflowS3Secret.name | quote }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.workflowS3Secret.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.workflowS3Secret.secretAccessKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.workflowS3Secret.region | quote }}
{{- end }}
