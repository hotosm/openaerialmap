{{- if .Values.workflowServiceAccount.create }}
# ServiceAccount the WorkflowTemplate assigns to pipeline step pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflowServiceAccount.name | quote }}
  labels: {{- include "chart.labels" . | nindent 4 }}
---
# Minimum RBAC the Argo workflow executor needs for this SA (emissary
# executor reports step results via workflowtaskresults).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-workflow-executor
  labels: {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-workflow-executor
  labels: {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" . }}-workflow-executor
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowServiceAccount.name | quote }}
    namespace: {{ .Release.Namespace }}
{{- end }}
