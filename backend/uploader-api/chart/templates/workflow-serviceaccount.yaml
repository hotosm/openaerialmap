{{- if .Values.workflowServiceAccount.create }}
# ServiceAccount the WorkflowTemplate assigns to pipeline step pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflowServiceAccount.name | quote }}
  labels: {{- include "chart.labels" . | nindent 4 }}
---
# Kubernetes 1.24 stopped minting a token Secret per ServiceAccount, but the
# Argo executor still mounts one by convention as `<sa>.service-account-token`.
# Without it every step pod sits in Init with a FailedMount on `exec-sa-token`,
# never reaching the container that would say why. The sync wave keeps this
# behind the ServiceAccount: the token controller deletes a token Secret whose
# ServiceAccount does not exist yet.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s.service-account-token" .Values.workflowServiceAccount.name | quote }}
  labels: {{- include "chart.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.workflowServiceAccount.name | quote }}
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/service-account-token
---
# Minimum RBAC the Argo workflow executor needs for this SA (emissary
# executor reports step results via workflowtaskresults).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-workflow-executor
  labels: {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-workflow-executor
  labels: {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" . }}-workflow-executor
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowServiceAccount.name | quote }}
    namespace: {{ .Release.Namespace }}
{{- end }}
