{{- if and .Values.db.enabled (not .Values.db.auth.existingSecret) }}
# The bundled database's password. A plain env value on the StatefulSet and the
# Deployment is readable by anyone who can `get pod`, which is a much commoner
# grant than `get secret`. Point db.auth.existingSecret at your own secret to
# manage it elsewhere.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.dbSecretName" . | quote }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.db.auth.passwordKey }}: {{ required "db.auth.password is required when the bundled database is enabled" .Values.db.auth.password | quote }}
{{- end }}
