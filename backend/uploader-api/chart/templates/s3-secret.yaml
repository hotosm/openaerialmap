{{- if .Values.s3Secret.create }}
# Both this chart's Deployment and the separately applied WorkflowTemplate read
# S3 credentials from this secret, by the key names configured in values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3Secret.name | quote }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3Secret.accessKeyIdKey }}: {{ .Values.s3Secret.accessKeyId | quote }}
  {{ .Values.s3Secret.secretAccessKeyKey }}: {{ .Values.s3Secret.secretAccessKey | quote }}
{{- end }}
