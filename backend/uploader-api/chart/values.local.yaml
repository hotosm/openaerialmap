# Local development overrides. Install with:
#   helm upgrade --install uploader-api ./chart \
#     --namespace oam --create-namespace \
#     -f chart/values.local.yaml
#
# Then access it from localhost with:
#   kubectl -n oam port-forward svc/uploader-api 8080:8080

fullnameOverride: uploader-api

image:
  tag: latest
  pullPolicy: IfNotPresent

env:
  # Override production mode because Helm merges this map with values.yaml.
  ENVIRONMENT: development
  AUTH_PROVIDER: disabled
  S3_ENDPOINT: http://rustfs:9000
  S3_EXTERNAL_ENDPOINT: http://localhost:9000
  PUBLIC_ASSET_BASE_URL: http://localhost:9000
  S3_BUCKET: oam
  ARGO_NAMESPACE: oam
  # This chart does not deploy pgstac. Point these settings at the local catalog
  # database and put PGSTAC_DB_PASSWORD in the secret.
  PGSTAC_DB_HOST: database
  PGSTAC_DB_USER: oam
  PGSTAC_DB_NAME: postgis
  # RustFS is in-network here, which the production SSRF guard rejects.
  FETCH_ALLOW_PRIVATE_HOSTS: "true"

# Sensitive env for local (normally these live in existingSecret).
# Create with:
#   kubectl -n oam create secret generic oam-uploader-local \
#     --from-literal=PGSTAC_DB_PASSWORD=password \
#     --from-literal=COOKIE_SECRET=change-me-32-characters-long-xxx
existingSecret:
  name: oam-uploader-local

# Have the chart create the S3 secret, rather than expecting a sealed one. This
# covers the pipeline steps as well as the app - the WorkflowTemplate reads the
# same secret and keys.
s3Secret:
  create: true
  accessKeyId: oam
  secretAccessKey: oam

# In-cluster PostGIS. Recreated per run, so keep storage ephemeral rather than
# leaving PVCs behind (the chart default is persistent).
db:
  enabled: true
  auth:
    username: oam
    password: oam
    database: oam_uploader
  primary:
    persistence:
      enabled: false
