<!-- What is being managed comes before what can be done with it. A save in
     Details sends this again out of band, so the title and facts follow. -->
<section id="imagery-summary" class="oam-card oam-imagery-summary"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if thumbnail %}
  <img class="oam-imagery-summary__thumb" src="{{ thumbnail }}" alt="Preview of {{ title }}" />
  {% else %}
  <div class="oam-imagery-summary__thumb oam-imagery-summary__thumb--empty">No preview</div>
  {% endif %}
  <div class="oam-imagery-summary__body">
    <p class="oam-eyebrow">Manage imagery</p>
    <h1>{{ title }}</h1>
    {% if facts %}
    <dl class="oam-facts">
      {% for label, value in facts %}
      <div>
        <dt>{{ label }}</dt>
        <dd>{{ value }}</dd>
      </div>
      {% endfor %}
    </dl>
    {% endif %}
    <div class="oam-imagery-summary__links">
      <wa-button
        size="s"
        appearance="outlined"
        href="{{ main_site_url }}/browse?view=mine&selected_id={{ item_id | urlencode }}"
        >View in Browse</wa-button
      >
      <a href="{{ item_url_base }}/{{ item_id | urlencode }}" target="_blank" rel="noreferrer"
        >STAC metadata</a
      >
    </div>
  </div>
</section>
