# Local counterpart to chart/templates/configmap.yaml. Keep the two in sync:
# same routes, same cache behavior, same style URL passed to chiitiler.

# Cache rendered PNGs; low-zoom tiles should stay hot.
proxy_cache_path /var/cache/nginx/tms
                 levels=1:2
                 keys_zone=tms_cache:10m
                 max_size=1g
                 inactive=7d
                 use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Local style URL passed to chiitiler on each tile request.
    location = /style.json {
        default_type application/json;
        alias /styles/style.json;
    }

    # PMTiles served from the shared volume so chiitiler can range-fetch over
    # HTTP, mirroring how the prod chart points chiitiler at an S3 URL.
    location = /global-coverage.pmtiles {
        alias /pmtiles/global-coverage.pmtiles;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
    }

    # z0-13 coverage via chiitiler; z14+ redirects below.
    location ~ ^/([0-9]|1[0-3])/([0-9]+)/([0-9]+)\.png$ {
        set $zoom_level $1;
        set $x $2;
        set $y $3;

        proxy_cache tms_cache;
        proxy_cache_valid 200 3600s;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        add_header X-Cache-Status $upstream_cache_status;

        # MapLibre requests raster tiles with crossOrigin=anonymous.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        # url=http%3A%2F%2F127.0.0.1%2Fstyle.json
        proxy_pass http://127.0.0.1:3000/tiles/$zoom_level/$x/$y.png?url=http%3A%2F%2F127.0.0.1%2Fstyle.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # z14+ real imagery via TiTiler. The 302 needs CORS too.
    location ~ ^/(1[4-9]|[2-9][0-9])/([0-9]+)/([0-9]+)\.png$ {
        set $zoom_level $1;
        set $x $2;
        set $y $3;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        return 302 https://api.imagery.hotosm.org/raster/collections/openaerialmap/tiles/WebMercatorQuad/$zoom_level/$x/$y.png?assets=visual;
    }

    # Friendly root page with info
    location = / {
        default_type text/html;
        return 200 '
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>OpenAerialMap Global Tile Server</title>
              <style>
                body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 2rem; line-height: 1.6; color: #333; }
                h1 { color: #444; }
                code { background: #eee; padding: 0.2rem 0.4rem; border-radius: 4px; word-break: break-all; }
                .url { display: block; margin: 1rem 0; padding: 0.75rem; background: #f4f4f4; border-radius: 6px; }
                ol { padding-left: 1.25rem; }
                a { color: #d63f40; }
              </style>
            </head>
            <body>
              <h1>OpenAerialMap Global Tile Server</h1>
              <p>This server provides a global XYZ / TMS raster tile layer of all OpenAerialMap imagery.</p>
              <p>Tile URL template:</p>
              <code class="url" id="tms-url">/{z}/{x}/{y}.png</code>

              <h2>Load it in QGIS</h2>
              <ol>
                <li>In the <strong>Browser</strong> panel, right-click <strong>XYZ Tiles</strong> and choose <strong>New Connection</strong>.</li>
                <li>Give it a name, e.g. <code>OpenAerialMap</code>.</li>
                <li>Paste the tile URL template above into the <strong>URL</strong> field.</li>
                <li>Click <strong>OK</strong>, then double-click the new connection to add it to your map.</li>
              </ol>
              <p>The same URL works in any XYZ-compatible client (JOSM, iD, MapLibre, Leaflet, etc.).</p>
              <p>See the <a href="https://docs.qgis.org/latest/en/docs/user_manual/managing_data_source/opening_data.html#using-xyz-tile-services" target="_blank" rel="noopener">QGIS XYZ tile services documentation</a> for more detail.</p>

              <p><small>Direct example tile: <a href="/0/0/0.png">/0/0/0.png</a></small></p>

              <script>
                document.getElementById("tms-url").textContent = window.location.origin + "/{z}/{x}/{y}.png";
              </script>
            </body>
            </html>';
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
