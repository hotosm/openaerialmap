apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* subPath mounts never update in place */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- /* Idempotent (id hashes the body). Falls back to the first collection so z0-13 never waits on TiTiler. */}}
        - name: register-mosaic
          image: curlimages/curl:8.21.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -o pipefail
              base="{{ .Values.titiler.url }}/collections/{{ first .Values.collections }}"
              id=$(curl -sSf --connect-timeout 5 --max-time 15 --retry 5 --retry-connrefused \
                -X POST "{{ .Values.titiler.url }}/searches/register" \
                -H "content-type: application/json" \
                -d '{"collections":{{ .Values.collections | toJson }},"metadata":{"type":"mosaic"}}' \
                | sed 's/.*"id":"\([0-9a-f]*\)".*/\1/')
              if [ ${#id} -eq 32 ]; then base="{{ .Values.titiler.url }}/searches/$id"; else echo "mosaic registration failed, serving $base" >&2; fi
              echo "return 302 $base/tiles/WebMercatorQuad/\$zoom_level/\$x/\$y.png?assets=visual;" > /mosaic/redirect.conf
          volumeMounts:
            - name: mosaic
              mountPath: /mosaic
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # chiitiler is configured via env vars; no config file.
          # Style JSON is fetched per-request from the nginx sidecar over loopback.
          env:
            - name: CHIITILER_PORT
              value: "3000"
            - name: CHIITILER_CACHE_METHOD
              value: {{ .Values.chiitilerCache.method | quote }}
            - name: CHIITILER_CACHE_TTL_SEC
              value: {{ .Values.chiitilerCache.ttlSeconds | quote }}
            - name: CHIITILER_FILECACHE_DIR
              value: {{ .Values.chiitilerCache.dir | quote }}
          ports:
            - name: chiitiler
              containerPort: 3000
              protocol: TCP
          {{- with .Values.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: chiitiler-cache
              mountPath: {{ .Values.chiitilerCache.dir }}
            {{- with .Values.volumeMounts }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
        - name: {{ .Chart.Name }}-nginx
          image: nginx:1.31-alpine
          ports:
            - containerPort: 80
              name: http
          livenessProbe: {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: style
              mountPath: /styles/style.json
              subPath: style.json
            - name: nginx-cache
              mountPath: /var/cache/nginx/tms
            - name: mosaic
              mountPath: /etc/nginx/mosaic
      volumes:
        - name: mosaic
          emptyDir: {}
        - name: style
          configMap:
            name: {{ include "chart.fullname" . }}-style
        - name: nginx-conf
          configMap:
            name: {{ include "chart.fullname" . }}-nginx
        - name: chiitiler-cache
          emptyDir:
            sizeLimit: {{ .Values.chiitilerCache.sizeLimit }}
        - name: nginx-cache
          emptyDir:
            sizeLimit: {{ .Values.nginxCache.sizeLimit }}
        {{- with .Values.volumes }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
