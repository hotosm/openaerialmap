api:
  image:
    repository: ghcr.io/hotosm/openaerialmap/tilepack/api
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: Always

worker:
  image:
    repository: ghcr.io/hotosm/openaerialmap/tilepack/worker
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: Always
  serviceAccountName: oam-tilepack-worker
  # Worker Jobs are created in the same namespace as the API release.
  resources:
    requests:
      # The scheduler only guarantees requests, so keep them near the limits.
      cpu: "2"
      memory: 2Gi  # benchmarked ~1.16 GB RSS on a dense urban scene
      ephemeral-storage: 10Gi  # ~2x the 4 GiB byte budget, plus margin
    limits:
      # Tile generation is CPU-bound, so this sets how long a scene takes.
      cpu: "4"
      memory: 4Gi
      ephemeral-storage: 14Gi

nameOverride: ""
fullnameOverride: ""

# Single replica only - the per-IP rate limiter is in-memory.
replicaCount: 1

config:
  stacBaseURL: "https://api.imagery.hotosm.org/stac"
  stacCollection: "openaerialmap"
  s3Bucket: "oin-hotosm-temp"
  s3PublicBaseURL: "https://oin-hotosm-temp.s3.us-east-1.amazonaws.com"
  # Leave empty for real AWS S3. Point it at an S3-compatible store (e.g. the
  # one the uploader-api chart can bundle) to read imagery and write tilepacks
  # there instead. The API passes it to each worker Job, and both halves switch
  # to path-style addressing, which a store without wildcard DNS needs.
  s3Endpoint: ""
  # Must exceed deadline + grace; the API refuses to start otherwise.
  lockTTLSeconds: 11400
  workerActiveDeadlineSeconds: 10800
  # How long a finished Job lingers; also the retry cooldown.
  workerJobTTLSeconds: 3600
  # SIGTERM to SIGKILL, for the worker to release its S3 lock.
  workerTerminationGraceSeconds: 60
  # Multiplies the worker resources above - re-derive if either changes.
  # At 2: 4 CPU / 4Gi / 20Gi reserved, bursting to 8 / 8Gi / 28Gi.
  maxConcurrentJobs: 2
  # Tile count bounds runtime; bytes bound disk.
  workerMaxTileCount: 150000
  # Quoted: unquoted, Helm renders it as 4.294967296e+09.
  workerMaxEncodedBytes: "4294967296"
  perIpRatePerSecond: "0.1"
  perIpBurst: 2
  # The in-cluster URL the worker calls to patch STAC assets.
  # Built from the Helm release name at template time if unset.
  internalBaseURL: ""
  # Mounted secret file path used by the API for runtime internal token validation.
  internalTokenFile: "/var/run/secrets/oam-tilepack-internal/token"

# pgstac DB connection - reuses the secret managed alongside the catalog DB.
# The worker never touches this; only the API pod reads it.
pgstac:
  # No default - set per environment (the secret name is env-specific).
  secretName: ""
  # Key inside the secret holding the libpq connection string.
  uriKey: "uri"

# S3 credentials with write access to the OAM imagery bucket.
# Reuses the existing oam-s3-creds Secret (S3_ACCESS_KEY /
# S3_SECRET_KEY), exposed to both pods as AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY so the default AWS credential chain picks
# them up automatically in both Go (aws-sdk-go-v2) and Python (boto3).
s3Credentials:
  secretName: "oam-s3-creds"
  accessKeyKey: "S3_ACCESS_KEY"
  secretKeyKey: "S3_SECRET_KEY"
  region: "us-east-1"

# Shared token between the API and the worker, for the internal
# asset-patch endpoint. A Secret is created by the chart if
# `create: true`; otherwise an existing secret is referenced.
internalTokenSecret:
  create: true
  name: "oam-tilepack-api-internal"
  # Only used when create=true. Generate with `openssl rand -hex 32`.
  token: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: packager.imagery.hotosm.org
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: packager.imagery.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
  tls:
    enabled: true
    secretName: oam-tilepack-api-tls

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
