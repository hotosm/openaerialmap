[project]
name = "tilepack-api-worker"
version = "0.1.0"
description = "Generate mbtiles and pmtiles files from STAC-based COG imagery."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.42.85",
    "httpx==0.28.1",
    "rasterio==1.5.0",
    "rio-tiler==9.0.5",
]

[dependency-groups]
test = [
  "pytest==8.3.5",
  # Pinned else tests can flag as red in the CI
  "ruff==0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["generate"]
