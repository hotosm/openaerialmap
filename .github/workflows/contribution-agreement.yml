name: 📜 Contribution Guidelines

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  sign:
    uses: hotosm/gh-workflows/.github/workflows/contributor_agreement.yml@4.1.0
    with:
      push_branch: main
    secrets: inherit
