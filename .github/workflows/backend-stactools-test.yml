# stactools tests via `just test stactools` / `just test stac-extension` (tasks/test).
name: Test stactools-hotosm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/stactools-hotosm/**"
      - "tasks/test"
      - ".github/workflows/backend-stactools-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event.pull_request.draft == false
    uses: hotosm/gh-workflows/.github/workflows/just.yml@4.1.0
    with:
      environment: "test"
      command: "test stactools"

  stac-extension:
    if: github.event.pull_request.draft == false
    uses: hotosm/gh-workflows/.github/workflows/just.yml@4.1.0
    with:
      environment: "test"
      command: "test stac-extension"
