name: Test stactools-hotosm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/stactools-hotosm/**"
      - ".github/workflows/backend-stactools-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend/stactools-hotosm

jobs:
  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync --all-extras

      - name: Run tests
        run: ./scripts/test

      - name: Check for lint
        run: ./scripts/lint

      - name: Run static type checking
        run: ./scripts/typecheck

      - name: Check lock file
        run: uv lock --check

  test-extension:
    name: Test STAC extension
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stactools-hotosm/stac-extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - run: npm install

      - run: npm test
