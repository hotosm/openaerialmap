name: Build Uploader Pipeline Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/uploader-api/pipeline/**"
      # The fetch step image ships the API's address-check module, which the
      # build context has to keep un-ignored.
      - "backend/uploader-api/app/uploads/url_guard.py"
      - "backend/.dockerignore"
      - "backend/stactools-hotosm/**"
  workflow_dispatch:

jobs:
  pipeline-images:
    uses: ./.github/workflows/_uploader-pipeline-images.yml
