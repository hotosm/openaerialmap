# Used by the `serve` stage only; the S3/CloudFront path does not read this.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/wasm application/javascript application/json
               application/ld+json application/geo+json application/vnd.geo+json
               application/x-ndjson application/xml text/xml text/css text/csv
               text/plain image/svg+xml font/woff2;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The one file that differs between deploys of an identical image.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
