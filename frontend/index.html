<!doctype html>
<!-- wa-cloak: FOUCE backstop, hides page until all custom elements are defined (2s max) -->
<html lang="en" class="hot-theme-light wa-theme-default wa-palette-hotosm wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/openaerialmap.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAerialMap</title>

    <!-- Header height token - read by the map container -->
    <style>
      :root {
        --header-height: 56px;
      }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- HOT fonts (not bundled in @hotosm/ui) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;700&family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />

    <!-- Runtime config must load before JS modules -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
